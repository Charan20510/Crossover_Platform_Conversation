{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — WA Gateway</title>
  <link rel="stylesheet" href="{% static 'ui/style.css' %}">
</head>
<body>
<div class="login-shell">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path d="M12 2C6.477 2 2 6.477 2 12c0 1.89.525 3.659 1.438 5.168L2 22l4.979-1.418A9.95 9.95 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2z"/>
        </svg>
      </div>
      <div class="login-logo-text">WA Gateway</div>
    </div>

    <div class="login-title">Welcome back</div>
    <div class="login-sub">Sign in with your username and password.</div>

    {% if error %}
    <div class="alert alert-error">{{ error }}</div>
    {% endif %}

    <form method="post" action="{% url 'ui:login' %}{% if next %}?next={{ next }}{% endif %}">
      {% csrf_token %}
      {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}

      <div class="form-group">
        <label class="form-label" for="username">Username</label>
        <input
          class="form-control"
          type="text"
          id="username"
          name="username"
          value="{{ username_val }}"
          autocomplete="username"
          autofocus
          required
        >
      </div>

      <div class="form-group">
        <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;">
          <label class="form-label" for="password" style="margin:0;">Password</label>
          <a href="{% url 'ui:password_reset' %}" style="font-size:.8rem;color:var(--muted);">Forgot password?</a>
        </div>
        <input
          class="form-control"
          type="password"
          id="password"
          name="password"
          autocomplete="current-password"
          required
        >
      </div>

      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;margin-top:4px;">
        Sign in →
      </button>
    </form>

    <p style="margin-top:20px;font-size:.85rem;color:var(--muted);text-align:center;">
      Don't have an account?
      <a href="{% url 'ui:signup' %}">Create one</a>
    </p>
  </div>
</div>
<div id="toast-container"></div>
<script src="{% static 'ui/app.js' %}"></script>
</body>
</html>
